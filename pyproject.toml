# The package `parro-api-client`: install it with `pipx install .` (or uv / pip) to get the
# commands `parro-client` and `parro-client-mcp`. It needs nothing beyond the Python 3.10+ standard
# library at run time; PyMuPDF / pypdf / Pillow are optional extras for reading attachments.
# setuptools is needed only to build the package.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "parro-api-client"
version = "0.6.0"
description = "Parro API client: a standalone CLI and an MCP server sharing one core; reads, and on request marks items as read and sends chat messages"
readme = "README.md"
license = "MIT AND CC-BY-4.0"  # the code is MIT; the README (in every package) and docs CC BY 4.0
license-files = ["LICENSE-CODE", "LICENSE"]
requires-python = ">=3.10"
dependencies = []
keywords = ["parro", "parnassys", "school", "cli", "mcp", "openapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.14",
]

[project.scripts]
parro-client = "parro.cli:run"
parro-client-mcp = "parro.mcp_server:run"

[project.urls]
Repository = "https://github.com/chris-swift-dev/parro-api-client"
Documentation = "https://chris-swift-dev.github.io/parro-api-client/"

[tool.setuptools]
packages = ["parro"]  # the client; parro_cli.py / parro_mcp.py are only for release archives

[project.optional-dependencies]
attachments = ["pymupdf", "pypdf", "pillow"]
dev = ["pytest", "ruff", "mypy", "openapi-schema-validator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy", "tools", "node_modules", "site"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear, UP pyupgrade,
# N naming, SIM simplifications, RUF ruff-specific.
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF"]
# The plan names the exceptions (NotLoggedIn, LoginHalted, ...); no "Error" suffix needed.
ignore = ["N818"]

[tool.mypy]
python_version = "3.10"
files = ["parro", "parro_cli.py", "parro_mcp.py", "tests"]
exclude = ["^legacy/"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# Optional libraries without type information.
module = ["fitz", "pypdf", "PIL", "PIL.*", "openapi_schema_validator", "openapi_schema_validator.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests use pytest fixtures and loose JSON; keep them typed but less strict.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
