name: Spec checks, and the site on GitHub Pages (landing page, Swagger UI in api/)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # A published release changes the landing page's download buttons (tools/build_landing.py).
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The release event runs on the tag, which the github-pages environment does not deploy from:
  # start this workflow again on main. GITHUB_TOKEN may start a workflow_dispatch run.
  follow-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install tooling
        run: |
          pip install -r requirements-dev.txt
          npm ci --ignore-scripts   # skips @scarf/scarf install telemetry from swagger-ui-dist

      # Only when samples/ is committed (e.g. a private repo): the generated specs must match it.
      - name: Generated specs are up to date
        if: hashFiles('samples/*.json') != ''
        run: |
          npm run spec
          git diff --exit-code -- openapi/ || {
            echo "::error::openapi/*.json is stale. Run 'npm run spec' and commit the result."; exit 1; }

      - name: Validate full spec
        if: hashFiles('openapi/parro.openapi.json') != ''
        run: |
          python3 tools/validate_spec.py openapi/parro.openapi.json
          npx redocly lint --config redocly.yaml openapi/parro.openapi.json

      - name: Validate public spec
        run: |
          python3 tools/validate_spec.py openapi/parro.public.openapi.json
          npx redocly lint --config redocly.yaml openapi/parro.public.openapi.json

      - name: Assemble site
        run: bash tools/build_site.sh _site
        env:
          GITHUB_TOKEN: ${{ github.token }}  # asks for the latest release; more requests allowed

      - uses: actions/configure-pages@v6
        if: github.ref == 'refs/heads/main'

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
