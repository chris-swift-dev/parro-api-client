name: Client checks

# Lint, type-check and test the Python client, and install it as a package on Windows, macOS and
# Linux (Python 3.10 and 3.14). Also called by release.yml before a release.
# samples/, legacy/ and the full spec are not in the repository, so the tests that need them skip.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types and tests (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Libraries Qt needs
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install tooling
        run: pip install -r requirements-test.txt

      - name: Ruff
        run: |
          ruff check .
          ruff format --check parro parro_gui tests parro_cli.py parro_mcp.py

      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest

      - name: Release archives build
        run: python3 tools/build_release.py

  systems:
    name: Tests and install, ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # Only pytest: proves the client runs without the optional PDF and image libraries.
      - name: Install pytest
        run: python -m pip install pytest

      - name: Pytest
        run: python -m pytest

      # Build the wheel, install it into a fresh venv with an empty home folder, and run
      # parro-client and parro-client-mcp as a user would (PLAN-installation phase 3).
      - name: Install and run the commands
        run: python tools/smoke_test_install.py

  desktop:
    name: Desktop app, ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Libraries Qt needs
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install Qt and pytest
        run: python -m pip install pytest -r requirements-gui.txt

      - name: Pytest, desktop app only
        run: python -m pytest tests/test_gui_app.py tests/test_gui_boundaries.py
