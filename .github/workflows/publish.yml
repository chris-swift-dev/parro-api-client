name: Publish to PyPI

# Uploads the Python packages with *trusted publishing*: PyPI trusts this workflow through GitHub's
# OIDC token, so no PyPI token is stored anywhere. Each job runs in its own GitHub environment, so
# the repository settings can require an approval before anything is published.
#
# * Publishing a GitHub release (release.yml made it as a draft) uploads that release's wheel and
#   sdist to PyPI: exactly the files reviewed in the draft, checked against its SHA256SUMS, not a
#   new build.
# * Running this workflow by hand (Actions → Publish to PyPI → Run workflow, on any branch) builds
#   the packages and uploads them to TestPyPI, to try an installation first:
#       pipx install --pip-args="--extra-index-url https://test.pypi.org/simple/" parro-api-client
#   (--extra-index-url, not --index-url: pipx also upgrades its own pip with these arguments, and
#   pip is not on TestPyPI.) TestPyPI accepts each version only once.
#
# One-time setup on pypi.org and test.pypi.org: add this repository as a trusted publisher for the
# project `parro-api-client` (workflow publish.yml, environments `pypi` and `testpypi`).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/parro-api-client/
    permissions:
      contents: read
      id-token: write   # for trusted publishing
    steps:
      - name: Download the packages of this release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern 'parro_api_client-*' --pattern SHA256SUMS

      - name: Check them against the release's SHA256SUMS
        run: |
          cd dist
          grep ' parro_api_client-' SHA256SUMS > packages.sha256
          test "$(wc -l < packages.sha256)" -eq 2
          sha256sum --check packages.sha256
          rm SHA256SUMS packages.sha256
          ls -l

      - uses: pypa/gh-action-pypi-publish@release/v1

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/parro-api-client/
    permissions:
      contents: read
      id-token: write   # for trusted publishing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build the packages
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python3 -m pip install -r requirements-release.txt
          python3 -m build --outdir dist
          ls -l dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
