name: Release

# Push a tag such as v0.1.0 to run this. It runs the client checks, checks that the tag matches
# parro.__version__, builds the source archives with checksums, and creates a *draft* GitHub release
# with the CHANGELOG.md section as notes. Review the draft on GitHub, then publish it there.
#
#   git tag -a v0.1.0 -m "parro-api-client 0.1.0" && git push origin v0.1.0

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the release and upload its files
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build archives, checksums and notes
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python3 tools/build_release.py --tag "$GITHUB_REF_NAME"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            dist/parro-api-client-"$version".zip \
            dist/parro-api-client-"$version".tar.gz \
            dist/SHA256SUMS \
            --verify-tag \
            --draft \
            --title "parro-api-client $version" \
            --notes-file dist/release-notes.md
