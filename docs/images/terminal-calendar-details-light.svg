<svg xmlns="http://www.w3.org/2000/svg" width="839" height="689" viewBox="0 0 839 689" role="img" aria-labelledby="title">
  <title id="title">Terminal output of parro-client calendar --details: the agenda per day, with locations, descriptions and attachments (invented example data).</title>
  <rect x="0.5" y="0.5" width="838" height="688" rx="8" fill="#ffffff" stroke="#d1d9e0"/>
  <path d="M0.5 32 V8.5 a8 8 0 0 1 8 -8 H830.5 a8 8 0 0 1 8 8 V32 Z" fill="#f6f8fa" stroke="#d1d9e0"/>
  <circle cx="18" cy="16" r="6" fill="#ff5f57"/><circle cx="38" cy="16" r="6" fill="#febc2e"/><circle cx="58" cy="16" r="6" fill="#28c840"/>
  <text x="419.5" y="20" text-anchor="middle" fill="#6e7781" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12">parro-api-client</text>
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1f2328" xml:space="preserve">
  <text x="18" y="63"><tspan fill="#116329" font-weight="bold">$</tspan> parro-client calendar --details</text>
  <text x="18" y="101"><tspan fill="#0550ae" font-weight="bold"># Agenda (7)</tspan></text>
  <text x="18" y="139"><tspan fill="#8250df" font-weight="bold">## Mon 2 Nov 2026</tspan></text>
  <text x="18" y="158">- all day, 10 days until Fri 13 Nov 2026  Projectweken: de ruimte<tspan fill="#6e7781"> · </tspan>Groep 3 - juf Eva<tspan fill="#6e7781"> · </tspan><tspan fill="#6e7781">#7000000202</tspan></text>
  <text x="18" y="196"><tspan fill="#8250df" font-weight="bold">## Wed 11 Nov 2026</tspan></text>
  <text x="18" y="215">- 17:30-19:00  Sint-Maartenviering<tspan fill="#6e7781"> · </tspan>Basisschool De Linde<tspan fill="#6e7781"> · </tspan><tspan fill="#6e7781">#7000000101</tspan></text>
  <text x="18" y="234">  📍 Schoolplein</text>
  <text x="18" y="253">  Lampionnenoptocht door de wijk. Verzamelen om 17.30 uur op het plein.</text>
  <text x="18" y="291"><tspan fill="#8250df" font-weight="bold">## Thu 12 Nov 2026</tspan></text>
  <text x="18" y="310">- all day  Excursie Natuurmuseum<tspan fill="#6e7781"> · </tspan>Groep 6 - meester Tom<tspan fill="#6e7781"> · </tspan><tspan fill="#bc4c00">RSVP needed</tspan><tspan fill="#6e7781"> · </tspan>helpers wanted<tspan fill="#6e7781"> · </tspan><tspan fill="#6e7781">#7000000301</tspan></text>
  <text x="18" y="329">  📍 Natuurmuseum Voorbeeldstad</text>
  <text x="18" y="348">  We vertrekken om 8.45 uur met de auto. Neem een lunchpakket mee.</text>
  <text x="18" y="367">  🙋 Rijden naar het museum: 1 of 2 signed up<tspan fill="#6e7781"> · </tspan><tspan fill="#6e7781">#7000000361</tspan></text>
  <text x="18" y="386">  🖼 Route.jpg<tspan fill="#6e7781"> · </tspan>1.3 MB<tspan fill="#6e7781"> · </tspan><tspan fill="#6e7781">#6000000401</tspan></text>
  <text x="18" y="405"><tspan fill="#116329">  → parro-client attachment 7000000301</tspan></text>
  <text x="18" y="443"><tspan fill="#8250df" font-weight="bold">## Tue 17 Nov 2026</tspan></text>
  <text x="18" y="462">- 15:00-19:00  Oudergesprekken groep 3<tspan fill="#6e7781"> · </tspan>Groep 3 - juf Eva<tspan fill="#6e7781"> · </tspan><tspan fill="#bc4c00">RSVP needed</tspan><tspan fill="#6e7781"> · </tspan><tspan fill="#bc4c00">● new</tspan><tspan fill="#6e7781"> · </tspan><tspan fill="#6e7781">#7000000201</tspan></text>
  <text x="18" y="481">  📍 Lokaal groep 3</text>
  <text x="18" y="500">  Kies een tijd van tien minuten. Laat het weten als geen enkele tijd past.</text>
