  <text x="18" y="671">- all day, 5 days until Fri 23 Jul 2027  Zomervakantie<tspan fill="#6e7781"> · </tspan>Basisschool De Linde<tspan fill="#6e7781"> · </tspan><tspan fill="#6e7781">#7000000105</tspan></text>
