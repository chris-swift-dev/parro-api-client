  <text x="18" y="557">- all day, 5 days until Fri 25 Dec 2026  Kerstvakantie<tspan fill="#6e7781"> · </tspan>Basisschool De Linde<tspan fill="#6e7781"> · </tspan><tspan fill="#6e7781">#7000000102</tspan></text>
